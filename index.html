        body::after {

            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        .shake { animation: shake 0.3s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }

        #welcome-screen {
            display: none;
            flex-direction: column;

            justify-content: center;
            height: 100vh;
            text-align: center;

            font-size: 2rem;

            width: 150px;

            text-align: center;
            font-size: 1.2rem;
            letter-spacing: 5px;

        button {
            background: #111;
            color: #fff;
            border: 1px solid #fff;
            padding: 10px 30px;
            margin-top: 20px;
            cursor: pointer;
            text-transform: uppercase;

        #desktop {
            display: none;
            padding: 60px 40px 40px 40px;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 25px;
            height: 100vh;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .folder {
            display: flex; flex-direction: column; align-items: center;
            cursor: pointer; transition: 0.2s; user-select: none;
            padding: 10px;
        }

        .folder:hover { background: rgba(0, 81, 255, 0.1); border: 1px solid #0051ff; border-radius: 5px; transform: scale(1.05); }

        .folder-icon {
            width: 50px; height: 38px;
            background: #e3b02a; border-radius: 0 5px 5px 5px;
            position: relative; margin-bottom: 10px;
            box-shadow: 2px 2px 0px #8a6d0a;
        }

        .folder-icon::before {
            content: ''; width: 20px; height: 8px;
            background: #e3b02a; position: absolute; top: -8px; left: 0;
            border-radius: 4px 4px 0 0;
        }

        .folder-name { font-size: 0.65rem; text-transform: uppercase; text-align: center; color: #aaa; transition: background 0.2s; }

        #window {

            background: #0a0a0a; border: 2px solid #0051ff;

        .window-header {

            color: white; font-weight: bold;
        }

        .close-btn { background: #000; color: white; border: 1px solid white; cursor: pointer; }

        #file-list { padding: 20px; }
