        }

            height: 100vh;
            text-align: center;
            background: radial-gradient(circle, #001a33 0%, #050505 100%);

        .welcome-text {
            font-size: 2rem;
            letter-spacing: 8px;
            color: #00ff41;
            margin-bottom: 10px;
            animation: blink 1s infinite;

        @keyframes blink { 50% { opacity: 0; } }

        .logo {
            width: 150px;
            margin-bottom: 20px;
            filter: grayscale(100%) brightness(1.5);
        }

        input {
            background: #000;
            border: 1px solid #333;
            color: #00ff41;
            padding: 15px;
            width: 300px;
            text-align: center;
            font-size: 1.2rem;
            letter-spacing: 5px;
            outline: none;
        }

        button {
            background: #111;
            color: #fff;
            border: 1px solid #fff;
            padding: 10px 30px;
            margin-top: 20px;
            cursor: pointer;
        }

        button:hover { background: #fff; color: #000; }

        #desktop {
            display: none;
            padding: 40px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 25px;
        }

        .folder {
            display: flex; flex-direction: column; align-items: center;
            cursor: pointer; transition: 0.2s; user-select: none;
            padding: 10px;
        }

        .folder:hover { background: rgba(0, 81, 255, 0.1); border: 1px solid #0051ff; border-radius: 5px; }

        .folder-icon {
            width: 50px; height: 38px;
            background: #e3b02a; border-radius: 0 5px 5px 5px;
            position: relative; margin-bottom: 10px;
        }

        .folder-icon::before {
            content: ''; width: 20px; height: 8px;
            background: #e3b02a; position: absolute; top: -8px; left: 0;
            border-radius: 4px 4px 0 0;
        }

        .folder-name { font-size: 0.65rem; text-transform: uppercase; text-align: center; color: #aaa; }

        #window {
            display: none;
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 70%; height: 60%;
            background: #0a0a0a; border: 2px solid #0051ff;
            z-index: 1000;
            box-shadow: 0 0 50px black;
        }

        .window-header {
            background: #0051ff; padding: 10px;
            display: flex; justify-content: space-between;
            color: white; font-weight: bold;
        }

        .close-btn { background: #000; color: white; border: 1px solid white; cursor: pointer; }

        #file-list { padding: 20px; }

        .file-item {
            display: flex; justify-content: space-between;
            padding: 10px; border-bottom: 1px solid #1a1a1a;
        }

        .read-link { background: #00ff41; color: black; text-decoration: none; padding: 5px 15px; font-size: 0.7rem; font-weight: bold; }

            myData.forEach((folder, index) => {

                div.className = "folder";
                div.ondblclick = () => tryOpenFolder(index);
                div.innerHTML = `<div class="folder-icon"></div><div class="folder-name">${folder.folderName}</div>`;

            });

            const folder = myData[index];
            const codeInput = prompt(`ENTER 5-DIGIT KEY FOR [${folder.folderName}]`);

                openFolder(index);
            } else if (codeInput !== null) {

            list.innerHTML = "";
            if(folder.files.length === 0) list.innerHTML = "<p style='color:#555'>FILE NOT FOUND / WIPED FROM SYSTEM</p>";
